    { name = "subaniyana", email = "xuxinj43@email.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncio>=4.0.0",
    "asyncmy>=0.2.15",
    "cryptography>=50.0.1",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.141.1",
    "huggingface-hub>=1.32.0",
    "jieba>=0.42.1",
    "langchain>=1.4.2",
    "langchain-deepseek>=1.1.1",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "omegaconf>=2.3.1",
    "optional>=0.0.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
